<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>许哥变形记 · 化蛆成蝶</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="game-container">
    <div class="score-panel">
        <div class="timer-box"><span>⏳</span><span id="timer">30</span></div>
        <div class="score-box"><span>🎯熟练</span><span id="score">15</span></div>
        <div class="maifu-box" id="maifuBox"><span>💕</span><span id="maifu">0</span></div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
    </div>
    <div class="status-indicator">
        <span class="morph-tag"><span id="morph-icon">🐛</span> 形态</span>
        <span id="morph-name">许哥是蛆</span>
    </div>
    <button class="btn-restart" id="restartBtn">🔄 重开蛆蝶局</button>
    <button class="btn-fullscreen" id="fullscreenBtn">⛶ 全屏</button>
    <div class="footer-tip">← 拖动/滑动 捏捏 →  |  赛训🟢 +5 练习🔵 +3 摸鱼🟠 -5 摆烂🔴 -10 麦麸💖 +1麦麸-1熟练</div>
</div>

<!-- 开始界面 -->
<div id="startModal" class="modal-overlay">
    <div class="modal-content modal-content-start">
        <div class="start-title">🐛 许哥变形记 🦋</div>
        <div class="start-sub">
            操控「捏捏」接住训练成果<br>
            初始熟练度15<br>
            💖 麦麸过多可能触发神秘结局
        </div>
        <div class="start-btn-area">
            <button class="btn-start" id="startGameBtn">🔛 开始</button>
        </div>
    </div>
</div>

<!-- 马哥送花确认弹窗 -->
<div id="flowerModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="ending-img-container">
            <img id="flowerImg" class="ending-img" src="images/mage_send_flower.png" alt="马哥送花">
        </div>
        <div class="flower-prompt">马哥向你送花，是否接受？</div>
        <div class="choice-container">
            <button class="btn-choice" id="agreeBtn">💖 同意</button>
            <button class="btn-choice" id="disagreeBtn">💔 拒绝</button>
        </div>
    </div>
</div>

<!-- 结局弹窗 -->
<div id="endModal" class="modal-overlay hidden">
    <div class="modal-content modal-content-end">
        <div class="ending-img-container" id="endingImgContainer">
            <img id="imgMaggot" class="ending-img hidden" src="images/xuge-maggot-end.png" alt="许哥是蛆">
            <img id="imgFly" class="ending-img hidden" src="images/xuge-fly-end.png" alt="许哥变苍蝇">
            <img id="imgButterfly" class="ending-img hidden" src="images/xuge-butterfly-end.png" alt="化蛆成蝶">
            <img id="imgFamily" class="ending-img hidden" src="images/蛆蛆家族.png" alt="蛆蛆家族">
            <img id="imgElope" class="ending-img hidden" src="images/私奔.png" alt="私奔">
        </div>
        <div id="endingTitle" class="ending-title hidden"></div>
        <div id="endingMessage"></div>
        <div class="chart-container">
            <canvas id="scoreChart" width="400" height="130"></canvas>
        </div>
        <button class="btn-again" id="againBtn">🎮 再来一局</button>
        <small class="end-modal-hint">点击按钮重新开始</small>
    </div>
</div>

<script src="js/game.js"></script>
</body>
</html>
